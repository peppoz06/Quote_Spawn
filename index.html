<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="landscape" />
    <meta
      name="description"
      content="Quote Spawn Massimo Troisi — Che Troisi sei oggi? Scene iconiche dal cinema di Massimo Troisi."
    />
    <title>Quote Spawn Massimo Troisi</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="rotate-hint" id="rotateHint" role="status">
      <span class="rotate-hint__icon" aria-hidden="true"></span>
      <p class="rotate-hint__text">Ruota il telefono in orizzontale</p>
    </div>

    <main class="stage" id="stage">
      <div class="scene" id="scene">
        <img
          class="backdrop"
          id="backdrop"
          alt="Scena cinematografica con Massimo Troisi e un televisore vintage"
          width="2320"
          height="1632"
          draggable="false"
        />

        <header class="titles">
          <h1>Quote spawn Massimo Troisi</h1>
          <p class="subtitle">Che Troisi sei oggi?</p>
        </header>

        <div class="tv-screen" id="tvScreen" aria-hidden="true">
          <video
            id="tvVideo"
            playsinline
            preload="metadata"
            disablePictureInPicture
          ></video>
          <div class="tv-glass" aria-hidden="true"></div>
          <div class="tv-power" id="tvPower" aria-hidden="true"></div>
        </div>

        <button
          type="button"
          class="playback-btn"
          id="playbackBtn"
          hidden
          aria-label="Pausa"
        >
          ⏸
        </button>

        <button type="button" class="spawn-btn" id="spawnBtn">
          Mostra
        </button>
      </div>
    </main>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
